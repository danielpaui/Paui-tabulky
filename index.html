<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jídelní deník</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jídelní deník">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F3;--surface:#FFFFFF;--ink:#16221F;--mute:#66736F;--line:#DCE3E0;--accent:#2F4FD8;--accent-ink:#FFFFFF;--over:#C2410C;--p:#2F4FD8;--c:#D99A1E;--f:#B5457A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--surface:#18221F;--ink:#E8EFEC;--mute:#8C9A95;--line:#2A3733;--accent:#7C93FF;--accent-ink:#0E1330;--over:#FB923C;--p:#7C93FF;--c:#E8B04A;--f:#E27AAE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101715;--surface:#18221F;--ink:#E8EFEC;--mute:#8C9A95;--line:#2A3733;--accent:#7C93FF;--accent-ink:#0E1330;--over:#FB923C;--p:#7C93FF;--c:#E8B04A;--f:#E27AAE;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 16px 80px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:1rem;font-weight:600;margin:0;text-transform:capitalize}
.nav{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:1.1rem}
.hero{margin:16px 0 8px;display:flex;flex-direction:column;align-items:center}.ring{position:relative;width:240px;height:240px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .tr{stroke:var(--line)}.ring .pr{transition:stroke-dashoffset .5s,stroke .5s}.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ctr .big{font-size:2.8rem}.ctr .big small{font-size:1.3rem;color:var(--mute);font-weight:600}
.big{font-size:4.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.big.over{color:var(--over)}
.cap{color:var(--mute);margin-top:4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:16px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.bar i.over{background:var(--over)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.macros div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--p)}
.macros div:nth-child(2){border-top-color:var(--c)}
.macros div:nth-child(3){border-top-color:var(--f)}
.macros b{font-size:1.1rem;display:block}
.macros span{color:var(--mute);font-size:.85rem}
.goal{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem;margin-bottom:20px}
.goal input{width:84px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:4px 14px 6px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.mh h2{font-size:1.05rem;margin:0}
.mh span{color:var(--mute);font-size:.9rem}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.it div{flex:1;min-width:0}
.it small{color:var(--mute);display:block}
.it .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;color:var(--mute);font-size:1.2rem;width:36px;height:36px}
.add{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;margin:6px 0 8px;color:var(--accent);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--surface);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 10px;font-size:1.1rem}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.res{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px}
.res small{color:var(--mute)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:6px}
.btn.alt{background:none;color:var(--accent);border:1px solid var(--line)}
.lbl{font-size:.85rem;color:var(--mute);margin:4px 0}
.hide{display:none}
:root{--over:#DC2626;--ok:#2FA84F;--low:#E0A800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--over:#F87171;--ok:#4ADE80;--low:#FACC15}}
:root[data-theme="dark"]{--over:#F87171;--ok:#4ADE80;--low:#FACC15}
.top h1{cursor:pointer;flex:1;text-align:center}
.dn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--line);font-size:.95rem}
.wd.ok .dn,.md.ok .dn{border-color:var(--ok)}.wd.hi .dn,.md.hi .dn{border-color:var(--over)}.wd.lo .dn,.md.lo .dn{border-color:var(--low)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-8px 0 6px}.mg label{font-size:.85rem;color:var(--mute);display:block}.mg input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;margin-top:2px}.goal input[readonly]{opacity:.65}
.mh h2{flex:1}.rw{display:flex;align-items:center;border-bottom:1px solid var(--line)}.rw .res{flex:1;min-width:0;border-bottom:0}.mh .cp{border:0;background:none;color:var(--accent);font-weight:600;margin-right:10px}
.wl{text-align:center;color:var(--mute);font-size:.8rem}
.md{background:none;border:0;padding:3px 0;display:flex;justify-content:center}
.md.sel .dn{background:var(--line)}.md.today .dn{color:var(--accent);font-weight:800}
.leg{display:flex;gap:14px;justify-content:center;color:var(--mute);font-size:.85rem;margin:10px 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--line);margin-right:5px;vertical-align:-2px}
.leg i.ok{border-color:var(--ok)}.leg i.hi{border-color:var(--over)}.leg i.lo{border-color:var(--low)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 0}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--mute)}
.wd b{font-size:1.05rem;color:var(--ink)}
.wd i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.wd.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd.today b{color:var(--accent)}
.wd.ok i{background:var(--ok)}.wd.hi i{background:var(--over)}.wd.lo i{background:var(--low)}
:root{--bg:#E9E2F0;--bg2:#DCE6F0;--surface:#F7F3FA;--ink:#2B2540;--mute:#6C6483;--line:#CDC3DA;--accent:#6556A8;--accent-ink:#FFFFFF;--p:#5B85B5;--c:#D39A52;--f:#C46F82;--pt:#D6E3F1;--ct:#F2E0C6;--ft:#EFD4DC;--ok:#5A9C78;--low:#D2A23F;--over:#C0555F;--t1:#F2DCC9;--t2:#D6E6DA;--t3:#D3E1EF;--t4:#E4D7EE;--soft:rgba(43,37,64,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1829;--bg2:#17202E;--surface:#2A2440;--ink:#EEE9F6;--mute:#ABA3C2;--line:#403858;--accent:#A99DE6;--accent-ink:#1B1536;--p:#86AADB;--c:#E2B274;--f:#DB8C9A;--pt:#2D3A52;--ct:#4A3F2E;--ft:#4D3039;--ok:#7DC09A;--low:#E2BA62;--over:#DE7D86;--t1:#3D2F37;--t2:#2B3B35;--t3:#2B3949;--t4:#37294B;--soft:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#1D1829;--bg2:#17202E;--surface:#2A2440;--ink:#EEE9F6;--mute:#ABA3C2;--line:#403858;--accent:#A99DE6;--accent-ink:#1B1536;--p:#86AADB;--c:#E2B274;--f:#DB8C9A;--pt:#2D3A52;--ct:#4A3F2E;--ft:#4D3039;--ok:#7DC09A;--low:#E2BA62;--over:#DE7D86;--t1:#3D2F37;--t2:#2B3B35;--t3:#2B3949;--t4:#37294B;--soft:rgba(255,255,255,.1)}
body{background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;min-height:100vh}
.hero{background:var(--surface);border-radius:28px;padding:22px 12px;margin:16px 0 12px;box-shadow:0 6px 24px rgba(60,40,100,.10)}
.macros div{border:0;border-left:5px solid var(--p);background:var(--pt)}
.macros div:nth-child(2){border-left-color:var(--c);background:var(--ct)}
.macros div:nth-child(3){border-left-color:var(--f);background:var(--ft)}
#meals .meal{border:0;border-radius:20px}
#meals .meal:nth-child(1){background:var(--t1)}#meals .meal:nth-child(2){background:var(--t2)}#meals .meal:nth-child(3){background:var(--t3)}#meals .meal:nth-child(4){background:var(--t4)}
#meals .it{border-top-color:var(--soft)}
.add{border:1.5px dashed var(--accent)}
.nav,.wd{border-color:transparent;box-shadow:0 2px 8px rgba(60,40,100,.08)}
.panel{border-radius:26px 26px 0 0}
.btn{border-radius:14px}
.macros div{border:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 6px 12px}
.tx{margin:0;min-width:0}
.vb{position:relative;display:block;width:46px;height:96px;border-radius:14px;background:var(--soft);overflow:hidden;flex:none}
.vb i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:14px;background:var(--line);transition:height .5s,background .5s}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:26px;padding:16px 14px;margin:16px 0 12px;box-shadow:0 6px 24px rgba(60,40,100,.10)}
.card .hero{background:none;box-shadow:none;padding:0;margin:0;flex:none}
.card .ring{width:clamp(112px,36vw,140px);height:clamp(112px,36vw,140px)}
.card .ctr .big{font-size:1.5rem;line-height:1.1;text-align:center}
.card .ctr .big small{display:block;font-size:.75rem}
.card .cap{font-size:.68rem;max-width:84px;text-align:center;line-height:1.2;margin-top:2px}
.card .macros{flex:1;min-width:0;margin:0;gap:4px}
.card .macros div,.card .macros div:nth-child(2),.card .macros div:nth-child(3){background:none;padding:0;gap:6px}
.card .vb{width:100%;max-width:34px;height:108px;border-radius:12px}
.card .vb i{border-radius:12px}
.card .macros b{font-size:.78rem;white-space:nowrap}
.card .macros span{font-size:.68rem}
input,select,textarea{font-size:16px}
select{font-family:inherit}
html{-webkit-text-size-adjust:100%}
.sheet.kb{align-items:flex-start}
.sheet.kb .panel{max-height:100%;border-radius:0 0 22px 22px;padding-bottom:12px}
.sheet.kb .panel h3{display:none}
#sheet,#sheet.kb{align-items:flex-start}
#sheet .panel,#sheet.kb .panel{margin-top:calc(env(safe-area-inset-top,0px) + 12px);max-height:min(calc(100% - 24px),calc(100vh - 420px));min-height:220px;border-radius:22px;padding-bottom:16px}
#sheet.kb .panel h3{display:block}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="nav" id="prev" aria-label="Předchozí týden">‹</button>
    <h1 id="dt"></h1>
    <button class="nav" id="cal" aria-label="Měsíční přehled"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <button class="nav" id="next" aria-label="Další týden">›</button>
  </div>
  <div class="week" id="week"></div>
  <div class="card"><section class="hero">
    <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><circle class="pr" id="pr" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div class="ctr"><div class="big" id="rem">0</div><div class="cap" id="cap"></div></div></div>
    
    
  </section>
  <section class="macros">
    <div><em class="vb"><i id="bp"></i></em><p class="tx"><b id="mp">0 g</b><span>Bílkoviny</span></p></div>
    <div><em class="vb"><i id="bc"></i></em><p class="tx"><b id="mc">0 g</b><span>Sacharidy</span></p></div>
    <div><em class="vb"><i id="bf"></i></em><p class="tx"><b id="mf">0 g</b><span>Tuky</span></p></div>
  </section></div>
  <button class="btn alt" id="prof" style="margin:0 0 18px">Profil a cíle</button>
  
  
  <div id="meals"></div>
  <p class="lbl" style="text-align:center;margin-top:18px">Produkty z databáze <a href="https://world.openfoodfacts.org" style="color:var(--accent)">Open Food Facts</a> (licence ODbL). Hodnoty vkládají uživatelé, ověř je podle obalu.</p>
</main>

<div class="sheet" id="sheet">
  <div class="panel" role="dialog" aria-modal="true">
    <h3 id="sh">Přidat potravinu</h3>
    <div id="s1">
      <input class="field" id="q" placeholder="Hledat potravinu" autocomplete="off">
      <div id="res"></div><div id="off"></div>
      <button class="btn alt" id="own">Vlastní potravina</button>
    </div>
    <div id="s2" class="hide">
      <div class="lbl" id="pn"></div>
      <div class="row"><div><div class="lbl" id="gl">Gramy</div><input class="field" type="number" id="gr" value="100" min="1" inputmode="decimal" aria-label="Množství v gramech"></div><div><div class="lbl">Kalorie</div><input class="field" type="number" id="kc" inputmode="decimal" aria-label="Kalorie"></div></div>
      <div class="lbl" id="pv"></div><div class="lbl" id="p1"></div>
      <button class="btn" id="ok">Přidat do deníku</button>
    </div>
    <div id="s3" class="hide">
      <input class="field" id="cn" placeholder="Název">
      <select class="field" id="cm"><option value="1">Hodnoty na celou porci (krabička, hotové jídlo)</option><option value="0">Hodnoty na 100 g</option><option value="2">Hodnoty na 1 g</option></select>
      <div class="row"><input class="field" type="number" id="ck" placeholder="kcal" inputmode="decimal"><input class="field" type="number" id="cp" placeholder="Bílkoviny" inputmode="decimal"></div>
      <div class="row"><input class="field" type="number" id="cs" placeholder="Sacharidy" inputmode="decimal"><input class="field" type="number" id="cf" placeholder="Tuky" inputmode="decimal"></div>
      <button class="btn" id="cok">Uložit a vybrat</button><button class="btn alt hide" id="cdel">Smazat potravinu</button>
    </div>
    <button class="btn alt" id="close">Zavřít</button>
  </div>
</div>

<div class="sheet" id="msheet"><div class="panel" role="dialog" aria-modal="true"><div class="top"><button class="nav" id="mprev" aria-label="Předchozí měsíc">‹</button><h3 id="mt" style="margin:0;text-transform:capitalize"></h3><button class="nav" id="mnext" aria-label="Další měsíc">›</button></div><div class="month" id="month"></div><div class="leg"><span><i class="ok"></i>V cíli</span><span><i class="lo"></i>Pod cílem</span><span><i class="hi"></i>Nad cílem</span></div><div class="lbl" id="mstat" style="text-align:center"></div><button class="btn alt" id="mclose">Zavřít</button></div></div>
<div class="sheet" id="psheet"><div class="panel" role="dialog" aria-modal="true"><h3 id="ph"></h3><p class="lbl" id="pi"></p><input class="field" id="pname" placeholder="Jméno (nepovinné)" autocomplete="off"><div class="lbl">Denní cíl makroživin</div><div class="mg" style="margin:0 0 8px"><label>B (g)<input type="number" id="gp" min="0" inputmode="numeric" placeholder="bílkoviny"></label><label>S (g)<input type="number" id="gc" min="0" inputmode="numeric" placeholder="sacharidy"></label><label>T (g)<input type="number" id="gf" min="0" inputmode="numeric" placeholder="tuky"></label></div><label class="goal" style="margin-bottom:6px">Denní cíl <input type="number" id="goal" min="500" max="8000" step="50" inputmode="numeric"> kcal</label><div class="lbl" id="gh" style="margin-bottom:12px"></div><div class="lbl" style="margin-top:6px">Záloha dat</div><div class="lbl" id="bk"></div><div class="row"><button class="btn alt" id="bdl">Stáhnout</button><button class="btn alt" id="bim">Načíst ze souboru</button></div><button class="btn alt" id="brs">Obnovit ze zálohy</button><input type="file" id="bf" accept=".json,application/json" class="hide"><button class="btn" id="psave">Uložit profil</button><button class="btn alt" id="pskip">Přeskočit</button></div></div>
<div class="sheet" id="csheet"><div class="panel" role="dialog" aria-modal="true"><h3 id="cph"></h3><div class="lbl">Na který den</div><input class="field" type="date" id="cpd"><div id="cpmw"><div class="lbl">Do jídla</div><select class="field" id="cpm"><option value="0">Snídaně</option><option value="1">Svačina</option><option value="2">Oběd</option><option value="3">Večeře</option></select></div><div class="lbl" id="cpr"></div><button class="btn" id="cpok">Zkopírovat</button><button class="btn alt" id="cpx">Zavřít</button></div></div>
<script>
// název, kcal, bílkoviny, sacharidy, tuky (na 100 g)
const BASE=[["Chléb pšenično-žitný",245,8,48,1.5],["Rohlík",290,9,56,2],["Houska",285,9,55,2],["Ovesné vločky",370,13,60,7],["Rýže vařená",130,2.7,28,0.3],["Těstoviny vařené",160,5.5,31,1],["Brambory vařené",77,2,17,0.1],["Kuřecí prsa",110,23,0,1.5],["Kuřecí stehno bez kůže",140,20,0,6],["Vepřová panenka",120,21,0,4],["Hovězí mleté",220,18,0,16],["Šunka výběrová",105,18,1,3],["Losos",200,20,0,13],["Tuňák ve vlastní šťávě",110,25,0,1],["Vejce slepičí",143,12.5,0.7,10],["Mléko polotučné",47,3.4,4.8,1.5],["Jogurt bílý",60,4,5,3],["Tvaroh polotučný",100,12,3.5,4],["Eidam 30 %",260,29,0,16],["Mozzarella",250,18,1,19],["Máslo",740,0.7,0.6,81],["Olivový olej",900,0,0,100],["Jablko",52,0.3,12,0.2],["Banán",90,1,21,0.3],["Pomeranč",47,0.9,10,0.2],["Jahody",33,0.7,7,0.3],["Borůvky",50,0.7,11,0.4],["Rajče",18,0.9,3.5,0.2],["Okurka",14,0.7,2.5,0.1],["Paprika",27,1,5,0.3],["Mrkev",36,0.9,8,0.2],["Brokolice",34,2.8,4,0.4],["Cibule",40,1.1,8,0.1],["Čočka vařená",115,9,16,0.4],["Cizrna vařená",165,9,22,3],["Mandle",600,21,10,52],["Vlašské ořechy",650,15,7,65],["Arašídové máslo",600,25,12,50],["Hořká čokoláda 70 %",580,8,35,42],["Mléčná čokoláda",540,7,57,31],["Med",320,0.4,80,0],["Cukr",400,0,100,0],["Pivo 12°",43,0.4,3.5,0],["Víno bílé",70,0.1,2,0],["Cola",42,0,10.6,0],["Pizza Margherita",250,11,32,9],["Hranolky",310,3.5,40,15],["Knedlík houskový",190,5,38,1.5],["Smažený sýr",300,14,18,19],["Svíčková omáčka",75,1.5,8,4]];
